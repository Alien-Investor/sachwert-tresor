summary: Local, encrypted vault for your Bitcoin, gold and silver — fully offline.

description: |
  Sachwert-Tresor is a local, encrypted vault for tracking your Bitcoin, gold and
  silver holdings. It runs fully offline — no cloud, no server, no telemetry, no
  price lookups over the network. Your data never leaves the device in plaintext.

  Features:
  - No INTERNET permission — the OS itself guarantees the app cannot phone home; verify
    it right in the APK manifest (since v2.0). Its only system permission is USE_BIOMETRIC
    for the optional fingerprint unlock (v3.0), plus USE_FINGERPRINT, brought in by
    androidx.biometric and limited by the app to Android 8.1 and below. The also-listed
    ...DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION is an app-internal AndroidX signature
    permission with no system access. The build aborts if the finished APK requests any
    other permission
  - FLAG_SECURE: no screenshots, no screen recording, no preview in recents (v2.0); no
    backup and no device-to-device transfer of vault data (v3.0)
  - AES-256-GCM encryption (native WebCrypto); since v3.0 the key is derived with Argon2id
    (64 MiB, 3 passes), far costlier to brute-force on GPUs than the former PBKDF2. Older
    vaults and backups keep opening and are switched over automatically
  - Optional fingerprint unlock (v3.0, Android Keystore): convenient, but it can be forced,
    and it is no extra factor. The passphrase is required after every reboot, after a
    passphrase change (fingerprint unlock is then off and must be re-enabled), after
    "Lock now" and whenever a new fingerprint is enrolled in
    Android — the app then switches fingerprint unlock off and warns you
  - Failed-attempt brake (v3.0): a growing wait after 3 wrong attempts
  - Optional 2FA (Aegis / TOTP, RFC 6238) with a self-contained QR encoder
  - Bitcoin: buys, sells and withdrawals; gold and silver by count × denomination
  - Multi-currency entries (EUR / USD / CHF), totals kept separate per currency —
    still zero network lookups (v2.1)
  - Manual current-value calculation — you enter prices yourself, nothing is fetched
  - Wealth over time (v2.12): every price you enter is remembered with its date, and the
    history tab draws the value of your holdings next to your cost basis — period switches
    (YTD/1Y/3Y/5Y/MAX) and a tap-to-read tooltip. Still zero network lookups: only your own
    price points are used, and before the first one there is deliberately no value line
  - Encrypted .vault backup, peer-to-peer sync via Syncthing (no cloud)
  - CSV export compatible with the BTC tax tool (KYC / noKYC kept separate)
  - Fully bilingual (German / English), offline in-app manual included
  - Open source (MIT) — Argon2id from the open-source hash-wasm library (MIT, checked
    against a pinned SHA-256 at build time); no external CDNs, no trackers

