<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0b201a"/>
      <stop offset="60%" stop-color="#04100c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="head" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3db86a"/>
      <stop offset="70%" stop-color="#1a6635"/>
      <stop offset="100%" stop-color="#0a2016"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Sternchen -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="172" cy="180" r="3"/><circle cx="300" cy="120" r="2"/>
    <circle cx="724" cy="120" r="2"/><circle cx="852" cy="190" r="3"/>
    <circle cx="150" cy="850" r="2"/><circle cx="884" cy="838" r="3"/>
  </g>
  <g fill="#00ffcc" opacity="0.5">
    <circle cx="384" cy="150" r="2"/><circle cx="648" cy="872" r="2"/>
  </g>

  <!-- Tresor-Motiv (zentriert, leicht skaliert für Rand) -->
  <g transform="translate(512,512) scale(0.86) translate(-512,-512)">
    <!-- Rim + Dial -->
    <g filter="url(#glow)">
      <circle cx="512" cy="512" r="398" fill="none" stroke="#00ffcc" stroke-width="22" opacity="0.9"/>
      <circle cx="512" cy="512" r="326" fill="none" stroke="#00ffcc" stroke-width="14" stroke-dasharray="10 75" opacity="0.7"/>
    </g>
    <!-- Nieten -->
    <g fill="#00ffcc" opacity="0.8">
      <circle cx="512" cy="142" r="12"/><circle cx="512" cy="882" r="12"/>
      <circle cx="142" cy="512" r="12"/><circle cx="882" cy="512" r="12"/>
      <circle cx="253" cy="253" r="10"/><circle cx="771" cy="253" r="10"/>
      <circle cx="253" cy="771" r="10"/><circle cx="771" cy="771" r="10"/>
    </g>
    <!-- Alien-Kopf als Nabe -->
    <g transform="translate(368,372) scale(8)" filter="url(#glow)">
      <line x1="10.32" y1="2.98" x2="0.6" y2="-5.2" stroke="#00ffcc" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0.6" cy="-5.2" r="3" fill="#00ffcc"/>
      <line x1="25.68" y1="2.98" x2="35.4" y2="-5.2" stroke="#00ffcc" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="35.4" cy="-5.2" r="3" fill="#00ffcc"/>
      <path fill="url(#head)" stroke="#00ffcc" stroke-width="0.8" d="M1.64 16.04A16.36 16.04 0 0 1 34.36 16.04C34.36 22.24 23.25 36 18 36C12.75 36 1.64 22.24 1.64 16.04Z"/>
      <path fill="#001a0e" stroke="#00ffcc" stroke-width="0.5" d="M5.41 15.84A6.55 3.52 32 0 0 9.1 22.29A6.55 3.52 32 0 0 16.51 22.78A6.55 3.52 32 0 0 12.83 16.33A6.55 3.52 32 0 0 5.41 15.84ZM19.49 22.78A6.55 3.52 -32 0 0 26.9 22.29A6.55 3.52 -32 0 0 30.59 15.84A6.55 3.52 -32 0 0 23.17 16.33A6.55 3.52 -32 0 0 19.49 22.78Z"/>
      <circle cx="9.49" cy="17.35" r="0.9" fill="#00ffcc"/>
      <circle cx="26.51" cy="17.35" r="0.9" fill="#00ffcc"/>
    </g>
    <!-- Werte-Punkte: BTC (orange), Gold, Silber -->
    <circle cx="512" cy="114" r="22" fill="#ff8844" filter="url(#glow)"/>
    <circle cx="857" cy="711" r="22" fill="#ffcc44" filter="url(#glow)"/>
    <circle cx="167" cy="711" r="22" fill="#c8d4dc" filter="url(#glow)"/>
  </g>
</svg>
